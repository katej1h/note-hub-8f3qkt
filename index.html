<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장</title>
<style>
:root{
  --cream:#FDFBF2;
  --ink:#40382B;
  --ink2:#6E6353;
  --muted:#A29786;
  --line:#EDE5D5;
  --pink:#D9789B;
  --pink-bg:#FDECF1;
  --mint-bg:#EAF6E4;
  --mint:#5FA463;
  --blue-bg:#E6F0FA;
  --blue:#4E76A0;
  --lav-bg:#F2EDFB;
  --peach-bg:#FFF0E4;
  --yellow-bg:#FFF4CE;
  --shadow:0 8px 22px rgba(178,162,127,.15);
  --shadow-soft:0 3px 10px rgba(178,162,127,.12);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#F3ECDC;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  display:flex;justify-content:center;
  min-height:100vh;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#DCC7A6;box-shadow:0 0 0 3px rgba(233,214,175,.35)}
h1,h2,h3,p{margin:0}
b,strong{font-weight:800}

#app{
  width:100%;max-width:430px;min-height:100vh;position:relative;
  background:
    radial-gradient(130% 46% at 50% 0%, #FFF6D6 0%, #FDFBF2 46%, #FDFBF2 100%);
  padding-bottom:96px;
  box-shadow:0 0 46px rgba(150,135,100,.18);
  overflow-x:hidden;
}

/* ---------- header ---------- */
.app-header{padding:16px 18px 4px}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:7px;padding-top:4px}
.brand-mascot{font-size:22px;line-height:1;filter:saturate(.9)}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.7px;color:#4A4033}
.brand h1 em{font-style:normal;color:var(--pink);font-weight:800}
.header-actions{display:flex;gap:8px}
.round-btn{
  position:relative;width:44px;height:44px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow-soft);display:grid;place-items:center;color:#6F6353;
  transition:transform .15s ease, box-shadow .15s ease;
}
.round-btn:active{transform:scale(.94)}
.round-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round-btn .dot{position:absolute;right:11px;top:11px;width:8px;height:8px;border-radius:50%;background:#79C47B;box-shadow:0 0 0 2px #fff}
.header-info{padding:10px 2px 0}
.date-line{font-size:12.5px;color:#A08F79;letter-spacing:-.2px}
.motto-line{font-size:13px;color:#8D8272;margin-top:2px}
.header-pill-row{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{
  display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;
  padding:7px 13px;font-size:12px;color:#6B5F4D;box-shadow:var(--shadow-soft);white-space:nowrap;
}
.pill.soft{background:rgba(255,255,255,.92)}
.pill.flame{background:#FFF0DE;color:#B4703A;font-weight:700;padding:5px 10px;box-shadow:none}
.pill.tiny{font-size:11px;padding:4px 9px;background:#FFF6E6;box-shadow:none;color:#A6763F;font-weight:700}
.pill.sync-badge{background:#F3F1EC;color:#7E7466;border:1px solid #E7E1D5;font-weight:700;transition:background .3s,color .3s,border-color .3s}
.pill.sync-badge[data-mode="on"]{background:#EFFAF3;color:#3E7B5B;border-color:#C9E8D5}
.pill.sync-badge[data-mode="wait"]{background:#FFF8EA;color:#A6752F;border-color:#F0E0C2}
.pill.sync-badge[data-mode="err"]{background:#FFF3EC;color:#A8632C;border-color:#F1D8C6}

/* ---------- layout ---------- */
main{padding:10px 0 0}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{
  background:#fff;border-radius:var(--r);padding:16px;margin:0 16px 14px;
  box-shadow:var(--shadow);border:1px solid rgba(238,229,211,.7);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-head h2{font-size:15.5px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.caption{font-size:12px;color:#9C9182;line-height:1.5;margin-top:2px}
.caption.small{font-size:11px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 20px 12px}
.view-head h2{font-size:19px;font-weight:800;letter-spacing:-.6px}
.view-head p{font-size:11.5px;color:#A0937F;margin-top:2px}
.today-chip{font-size:11px;color:#A0937F;background:#fff;border-radius:999px;padding:5px 10px;box-shadow:var(--shadow-soft);white-space:nowrap}

/* ---------- weather ---------- */
.weather-card{
  background:linear-gradient(135deg,#F4FAFF 0%,#FDFDF6 55%,#FFFBE9 100%);
  padding:13px 14px;border:1px solid #E8F0F7;
}
.weather-main{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wx-emoji{font-size:23px;line-height:1}
.wx-temp{font-size:19px;font-weight:800;letter-spacing:-.6px;color:#4A5B63}
.wx-desc{display:flex;flex-direction:column;line-height:1.15;font-size:11px;color:#8B8377}
.wx-desc b{font-size:12cent}
.wx-desc strong{font-size:11.5px;color:#6C7C84;font-weight:700}
.wx-range{font-size:11px;color:#98A0A6}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 9px;background:#F4F1E8;color:#7C725F}
.chip.good{background:#E6F5E4;color:#4E8B52}
.chip.moderate{background:#FFF3D8;color:#A97C2A}
.chip.bad{background:#FFE7DC;color:#B4674C}
.chip.verybad{background:#FFDFE0;color:#B84A52}
.chip.soft{background:#fff;color:#7C725F;box-shadow:var(--shadow-soft)}
.weather-sub{display:flex;gap:6px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px dashed #E5EDF2}

/* ---------- family ---------- */
.family-panel{
  margin:0 16px 14px;padding:14px 12px 12px;border-radius:26px;
  background:linear-gradient(150deg,#EFF8E9 0%,#F7FBEF 45%,#FFF8E6 100%);
  border:1px solid #E7EFDA;box-shadow:var(--shadow);
}
.panel-title{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;font-size:12px;font-weight:800;color:#7C8A6D}
.panel-count{font-size:10.5px;font-weight:700;color:#9AA98B;background:rgba(255,255,255,.7);border-radius:999px;padding:3px 8px}
.family-list{display:flex;flex-direction:column;gap:8px}
.member-row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:#fff;border-radius:18px;padding:9px 12px 9px 9px;
  box-shadow:0 2px 8px rgba(160,170,140,.12);border:1px solid rgba(255,255,255,.9);
  transition:transform .14s ease, box-shadow .14s ease;
}
.member-row:active{transform:scale(.985);box-shadow:0 1px 4px rgba(160,170,140,.16)}
.member-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.member-name{font-size:15.5px;font-weight:800;letter-spacing:-.4px;color:#463E31}
.member-tag{font-size:10.5px;color:#AFA492;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.stat-stars{font-size:13px;font-weight:800;color:#4C4335;display:inline-flex;align-items:center;gap:3px}
.stat-stars svg{width:15px;height:15px;fill:#F5C450;stroke:#E2A932;stroke-width:1.1;stroke-linejoin:round}
.stat-stars b{font-size:14px}
.stat-money{font-size:10.5px;color:#B08D74;font-weight:700;white-space:nowrap}
.stat-money.muted{color:#B7AC9B;font-weight:600}

/* avatars */
.avatar{display:inline-flex;flex-shrink:0;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 2px #FFFDF7,0 0 0 3.5px #F4E7D4,0 4px 10px rgba(175,155,120,.18)}
.avatar svg{display:block;width:100%;height:100%}
.avatar.xs{width:30px;height:30px}
.avatar.sm{width:38px;height:38px}
.avatar.md{width:48px;height:48px}
.avatar.lg{width:54px;height:54px}

/* ---------- stamp ---------- */
.stamp-card{background:linear-gradient(120deg,#FFFDF3 0%,#FFF8F1 55%,#F7F1FC 100%)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0 10px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.day-label{font-size:10.5px;color:#A99E8C;font-weight:700}
.day-circle{
  width:100%;max-width:38px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
  border:2px dashed #E3D6BE;background:rgba(255,255,255,.6);font-size:17px;color:#D9CBB3;
}
.day.done .day-circle{border:2px solid #F2C879;background:linear-gradient(160deg,#FFF6DB,#FFEBBE);box-shadow:0 3px 8px rgba(228,190,110,.28)}
.day.today .day-circle{border-color:#E9B96B;border-style:solid;background:#fff;font-weight:800;color:#C9A163}
.day.today.done .day-circle{background:linear-gradient(160deg,#FFF5D6,#FFE8B6)}
.day.future .day-circle{opacity:.45}
.day .mini{width:28px;height:28px;border-radius:50%;overflow:hidden;display:block}
.day .mini svg{width:100%;height:100%;display:block}
.stamp-mark{width:78%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;display:block;box-shadow:0 2px 6px rgba(190,160,110,.32)}
.stamp-mark svg{width:100%;height:100%;display:block;border-radius:50%}
.cal-stamp{width:21px;height:21px;border-radius:50%;overflow:hidden;display:inline-block;vertical-align:middle}
.cal-stamp svg{width:100%;height:100%;display:block}
.med-tag{background:#F1ECFA;color:#9883B5}
.stamp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed #EDE3D2}
.stamp-sum{font-size:11.5px;color:#93887A}
.stamp-sum b{color:#7A6A55;font-size:13px}

/* ---------- mission ---------- */
.mission-card{background:linear-gradient(150deg,#FFF1E3 0%,#FFEFF0 55%,#FDF6EE 100%);border-color:#F6E3D6}
.mission-emoji{font-size:34px;line-height:1;margin:8px 0 6px}
.mission-text{font-size:16px;font-weight:800;letter-spacing:-.4px;color:#5A4636}
.mission-card .row2{margin-top:12px}
.mission-card .caption{margin-top:9px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border-radius:14px;padding:10px 14px;font-size:13px;font-weight:800;letter-spacing:-.3px;
  background:#F5F1E7;color:#6E6353;transition:transform .12s ease,filter .12s ease;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(160deg,#DFF3DA,#CDEBCC);color:#40703F;box-shadow:0 4px 10px rgba(120,180,120,.22)}
.btn.ghost{background:#fff;box-shadow:var(--shadow-soft);color:#6E6353;border:1px solid #F0E8D8}
.btn.blue{background:#E7F0FA;color:#456A93;box-shadow:none}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:12px}
.btn.xs{padding:6px 9px;font-size:11px;border-radius:10px}
.btn.lg{padding:13px 16px;font-size:14.5px;border-radius:16px}
.btn:disabled{opacity:.6;filter:grayscale(.2)}
.btn.dashed{
  width:100%;margin-top:10px;border-radius:14px;border:1.6px dashed #DFD3BC;
  background:rgba(255,255,255,.6);color:#9A8B72;font-size:12.5px;font-weight:700;padding:10px;
}
.row2{display:flex;gap:8px}
.row2>*{flex:1}

/* ---------- routine ---------- */
.routine-card{padding:14px 14px 12px;border-radius:20px}
.routine-card.tone-mom{background:linear-gradient(160deg,#FDF0F4,#FEFBF7)}
.routine-card.tone-dad{background:linear-gradient(160deg,#EEF4FC,#FBFCFD)}
.routine-card.tone-jin{background:linear-gradient(160deg,#EFF9E9,#FCFDF8)}
.routine-card.tone-wan{background:linear-gradient(160deg,#FFF8E4,#FFFDF7)}
.routine-card.tone-dan{background:linear-gradient(160deg,#FCF1E6,#FFFCF8)}
.member-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px dashed #E9DFCC;margin-bottom:2px}
.member-head .mh-info{flex:1;min-width:0;display:flex;flex-direction:column}
.member-head .mh-name{font-size:15px;font-weight:800;letter-spacing:-.3px}
.member-head .mh-sub{font-size:10.5px;color:#A29786}
.task-list{list-style:none;margin:0;padding:0}
.task-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed #EDE4D3}
.task-row:last-child{border-bottom:0}
.check{
  width:23px;height:23px;flex-shrink:0;border-radius:8px;border:2px solid #DBD3C3;background:#fff;
  display:grid;place-items:center;font-size:12px;color:#fff;transition:all .15s ease;
}
.check.on{background:#6FBE72;border-color:#6FBE72;box-shadow:0 2px 6px rgba(111,190,114,.3)}
.task-text{flex:1;min-width:0;font-size:13.5px;color:#4E4638;word-break:break-word}
.task-row.done .task-text{color:#B5AC9C;text-decoration:line-through;text-decoration-color:#CFC6B6}
.task-meta{display:flex;align-items:center;gap:4px;flex-shrink:0}
.icon-btn{
  width:30px;height:30px;border-radius:10px;border:1px solid #F0E8D8;background:#fff;
  display:grid;place-items:center;font-size:12.5px;color:#B6A78C;flex-shrink:0;
}
.icon-btn:active{background:#FAF6EC}
.icon-btn.danger{color:#C98A83}
.icon-btn.on{background:#FFF3D6;border-color:#F2DCA6;color:#B48A3C}

/* ---------- study ---------- */
.study-card{background:linear-gradient(170deg,#FAFDFF 0%,#FFFFFF 30%,#FFFDF6 100%)}
.study-child{padding:12px 0 6px;border-top:1px dashed #EAF0F2}
.study-child:first-of-type{border-top:0;padding-top:4px}
.study-head{display:flex;align-items:center;gap:9px}
.study-head .sh-info{flex:1;min-width:0;display:flex;flex-direction:column}
.study-head .sh-name{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.study-head .sh-sub{font-size:10.5px;color:#A29786}
.money-pill{font-size:11.5px;font-weight:800;color:#9A7B43;background:#FFF6DE;border:1px solid #F4E3B8;border-radius:999px;padding:5px 10px;white-space:nowrap}
.progress{height:7px;border-radius:99px;background:#EDF3F6;overflow:hidden;margin:9px 0 2px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A9CFEA,#8FBFE2);transition:width .3s ease}
.study-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #EDF1F2}
.study-row:last-child{border-bottom:0}
.study-title{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.study-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.study-name{font-size:13px;color:#46443B}
.study-row.done .study-name{color:#B5AC9C;text-decoration:line-through;text-decoration-color:#CFC6B6}
.tag{font-size:9.5px;font-weight:800;color:#8D8467;background:#FBF4E1;border-radius:999px;padding:2px 7px}
.amount{font-size:10.5px;font-weight:800;color:#B08A45;background:#FFF8E6;border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.study-empty{font-size:12px;color:#B0A697;padding:10px 0}

/* ---------- timer ---------- */
.timer-card{background:linear-gradient(165deg,#F6FAFF 0%,#FFFDF6 60%,#FFF9EC 100%);border-color:#E9F0F7}
.timer-card.finished{animation:pulse 1s ease 2}
@keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px rgba(120,190,140,.35)}}
.seg{display:flex;gap:4px;background:#F1EEE4;border-radius:999px;padding:4px;margin:8px 0 0}
.seg-btn{flex:1;border-radius:999px;padding:8px 6px;font-size:12px;font-weight:700;color:#9A9080;white-space:nowrap}
.seg-btn.active{background:#fff;color:#4E6E8E;box-shadow:0 2px 6px rgba(150,160,170,.18)}
.timer-hint{font-size:11.5px;color:#9C9182;margin-top:10px;text-align:center}
.timer-display{
  font-size:62px;font-weight:800;letter-spacing:-2.5px;color:#3C5876;text-align:center;
  font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 8px;
}
.timer-card.running .timer-display{color:#41705A}
.chips{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.chip-btn{border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:#7E8B93;background:#fff;border:1px solid #E6EDF2;box-shadow:var(--shadow-soft)}
.chip-btn.active{background:#E7EFF9;border-color:#BFD5EA;color:#42678B}
.custom-row{display:flex;gap:6px;margin-top:8px}
.custom-row input{text-align:center;padding:8px 10px;font-size:12.5px}
.custom-row button{border-radius:12px;padding:0 14px;font-size:12px;font-weight:800;background:#F5F1E7;color:#7A6C56;white-space:nowrap}

/* ---------- wallet ---------- */
.wallet-card{background:linear-gradient(160deg,#FFFCF3 0%,#FFF8F1 45%,#FDF3F6 100%);border-color:#F5EBDD}
.wallet-hero{border-radius:18px;padding:14px;margin-top:10px;background:linear-gradient(140deg,#FFF7E9,#FFEFF3);border:1px solid #F7E6D3}
.wh-label{font-size:11.5px;color:#A08D77;font-weight:700}
.wh-amount{display:block;font-size:28px;font-weight:800;letter-spacing:-1.2px;color:#8B6A43;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.wh-pills{display:flex;flex-wrap:wrap;gap:5px}
.wh-pills span{font-size:10.5px;font-weight:700;color:#927C60;background:rgba(255,255,255,.82);border-radius:999px;padding:4px 9px;border:1px solid #F3E7D6}
.goal-box{margin-top:10px}
.goal-top{display:flex;justify-content:space-between;font-size:11px;color:#9E8B74;font-weight:700;margin-bottom:4px}
.goal-bar{height:8px;border-radius:99px;background:#F1E6D6;overflow:hidden}
.goal-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F8CE8B,#F0AE72);transition:width .3s ease}
.start-row{display:flex;align-items:center;gap:8px;margin-top:11px}
.start-row label{font-size:11px;color:#9C8B74;font-weight:700;white-space:nowrap}
.start-row input{padding:7px 10px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.wallet-sec{margin-top:14px;padding-top:12px;border-top:1px dashed #EFE4D4}
.wallet-sec h3{font-size:12.5px;font-weight:800;color:#7A6C57;display:flex;align-items:center;gap:5px}
.daily-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#8D8272;padding:7px 0;border-bottom:1px dashed #F1EADD}
.daily-row:last-child{border-bottom:0}
.daily-row b{color:#9A7B43;font-weight:800}
.entry-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #F1EADD;font-size:11.5px;color:#8A7F6D}
.entry-row .e-main{flex:1;min-width:0}
.entry-row .e-amt{font-weight:800;white-space:nowrap}
.entry-row .e-amt.plus{color:#5D9159}
.entry-row .e-amt.minus{color:#C07A73}
.entry-row .e-date{color:#B3A796;font-size:10.5px}
.money-btns{display:flex;gap:6px;margin-top:8px}
.member-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.member-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px 5px 5px;background:#fff;border:1px solid #EFE6D6;font-size:12px;font-weight:700;color:#7A6C56;box-shadow:var(--shadow-soft)}
.member-chip.active{background:#FFF4D9;border-color:#EFD69C;color:#8C6A2F}
.member-chip .avatar.xs{box-shadow:none}

/* ---------- health ---------- */
.med-card{background:linear-gradient(160deg,#FFF7F9 0%,#FDFBF4 60%,#F6FBF6 100%);border-color:#F3E6E8}
.med-row{display:flex;gap:8px;margin-top:12px}
.med-btn{
  flex:1;border-radius:16px;padding:14px 8px;background:#fff;border:1.5px solid #EFE4DC;
  font-size:12.5px;font-weight:800;color:#9A8B7C;display:flex;flex-direction:column;gap:4px;align-items:center;
  transition:all .15s ease;
}
.med-btn .m-emoji{font-size:20px}
.med-btn.on{background:linear-gradient(160deg,#E8F6E5,#D7EFDB);border-color:#B9DFC0;color:#487A4E;box-shadow:0 4px 10px rgba(120,180,130,.2)}
.med-strip{display:flex;justify-content:space-between;gap:3px;margin-top:14px;padding-top:12px;border-top:1px dashed #EFE6E3}
.med-day{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.med-day .md-label{font-size:10px;color:#AB9F92;font-weight:700}
.med-day .md-dots{display:flex;gap:2px}
.med-day .md-dot{width:9px;height:9px;border-radius:50%;background:#EFE6DF}
.med-day .md-dot.on{background:#79C07E}
.med-day.today .md-label{color:#D08A9E}
.note-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #EFE7D9}
.note-row:last-child{border-bottom:0}
.note-body{flex:1;min-width:0}
.note-top{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.note-top .n-date{font-size:10.5px;color:#AEA392;font-weight:700}
.note-top .n-member{font-size:10px;font-weight:800;color:#8B7B67;background:#F8F3E8;border-radius:999px;padding:2px 7px}
.note-top .n-kind{font-size:10px;font-weight:800;color:#7E8C6B;background:#EFF6E8;border-radius:999px;padding:2px 7px}
.note-text{font-size:12.5px;color:#5C5445;word-break:break-word}
.praise-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.praise-chip{border-radius:999px;padding:8px 12px;font-size:11.5px;font-weight:700;background:#fff;border:1px solid #EFE6D6;color:#7A6C56}
.praise-chip.active{background:#FFF3D6;border-color:#EFD69C;color:#8C6A2F}
.praise-log{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed #F0E8DA;font-size:12px;color:#6E6353}
.praise-log:last-child{border-bottom:0}
.praise-log .pl-text{flex:1;min-width:0}
.praise-log .pl-date{font-size:10.5px;color:#B3A796}

/* ---------- chat ---------- */
.view-chat{padding-bottom:210px}
.chat-card{background:linear-gradient(160deg,#FFFDF4,#FDF6F2);border-color:#F5EBDF}
.who-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:10px;scrollbar-width:none}
.who-row::-webkit-scrollbar{display:none}
.who-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px 6px 6px;background:#fff;border:1.5px solid #F0E7D8;font-size:12px;font-weight:700;color:#7E7060;flex-shrink:0}
.who-chip.active{border-color:#9EC6E4;background:#EEF6FD;color:#41678B;box-shadow:0 0 0 2px rgba(158,198,228,.22)}
.chat-list{display:flex;flex-direction:column;gap:14px;padding:4px 18px 10px}
.chat-day{align-self:center;font-size:10.5px;color:#A99E8D;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 11px;box-shadow:var(--shadow-soft)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.mine{flex-direction:row-reverse}
.msg-body{display:flex;flex-direction:column;gap:3px;max-width:76%}
.msg.mine .msg-body{align-items:flex-end}
.msg-meta{font-size:10.5px;color:#A99E8D;display:flex;gap:5px;align-items:center}
.msg-meta b{font-weight:800;color:#8B7E6B}
.bubble{
  background:#fff;border-radius:16px 16px 16px 5px;padding:10px 13px;font-size:13px;color:#4E4638;
  box-shadow:0 3px 10px rgba(175,160,130,.14);word-break:break-word;white-space:pre-wrap;
}
.msg.mine .bubble{background:linear-gradient(160deg,#E9F3FE,#DDEBFA);border-radius:16px 16px 5px 16px;color:#3D5872}
.bubble.sticker{background:none;box-shadow:none;padding:0;font-size:56px;line-height:1}
.msg-actions{display:flex;gap:4px;align-items:center;margin-top:2px}
.react{border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#fff;border:1px solid #F0E8D8;color:#B08E8E;box-shadow:var(--shadow-soft)}
.react.on{background:#FFEFF0;border-color:#F5C7CB;color:#D4737B}
.react.del{color:#C3B7A4;font-weight:700}
.chat-empty{text-align:center;font-size:12px;color:#B0A695;padding:22px 0}
.composer{
  position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;display:flex;gap:7px;align-items:center;padding:10px 14px 12px;
  background:linear-gradient(180deg,rgba(253,251,242,0),rgba(253,251,242,.96) 42%);
  z-index:30;
}
.composer input{border-radius:999px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow-soft);border-color:#EFE7D8}
.composer .send{border-radius:50%;width:44px;height:44px;flex-shrink:0;background:linear-gradient(160deg,#FFE6EE,#FBD3E0);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow-soft)}
.composer .sticker-btn{border-radius:50%;width:44px;height:44px;flex-shrink:0;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow-soft)}
.sticker-panel{
  position:fixed;bottom:calc(146px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:398px;background:#fff;border-radius:20px;padding:12px;
  box-shadow:0 12px 30px rgba(150,135,100,.24);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;z-index:31;
}
.sticker-panel.hidden{display:none}
.sticker-panel button{font-size:26px;padding:6px 0;border-radius:12px}
.sticker-panel button:active{background:#FFF6E4}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  display:flex;justify-content:space-between;padding:7px 8px calc(8px + env(safe-area-inset-bottom));
  background:#FFFDF5;
  border-top:1px solid #F0E7D6;z-index:40;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:#B3A895;border-radius:14px}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:-.2px}
.tab.active{color:#A97C3F}
.tab.active .tab-inner{background:#FFF2CB;border-radius:12px}
.tab-inner{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 9px 3px}
.tab.active svg{stroke:#C08F32}

/* ---------- sheet / toast ---------- */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(63,52,35,.34);display:none;z-index:60;
  align-items:flex-end;justify-content:center;padding:0;
}
.sheet-backdrop.open{display:flex}
.sheet{
  width:100%;max-width:430px;background:#FFFDF7;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:up .24s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:#E5DCC9;margin:2px auto 12px}
.sheet-head{position:relative;padding-right:34px;margin-bottom:12px}
.sheet-head h3{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.sheet-head p{font-size:11.5px;color:#9C9182;margin-top:3px}
.sheet-close{position:absolute;right:0;top:0;width:30px;height:30px;border-radius:50%;background:#F4EFE3;color:#9A8E7B;font-size:12px;display:grid;place-items:center}
.sheet-body{display:flex;flex-direction:column;gap:10px}
.sheet-foot{margin-top:14px;display:flex;gap:8px}
.sheet-foot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:11px;font-weight:800;color:#9A8C77;letter-spacing:-.2px}
.field input,.field select,.field textarea{padding:11px 12px;font-size:13px;border-radius:13px;border-color:#EDE4D4;background:#fff}
.field textarea{min-height:66px;resize:vertical}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.sheet-note{font-size:11px;color:#A99C89;line-height:1.5}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;display:grid;place-items:center;font-size:11.5px;border-radius:10px;color:#8C8272}
.cal-cell.head{color:#B3A796;font-size:10px;font-weight:800}
.cal-cell.stamp{background:#FFF3D6;color:#A97C3F;font-weight:800}
.cal-cell.today{outline:2px solid #EFD69C;outline-offset:-2px}
.cal-cell.empty{color:transparent}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:rgba(58,48,36,.94);color:#FFF8E9;font-size:12.5px;font-weight:600;
  padding:11px 17px;border-radius:999px;z-index:90;opacity:0;pointer-events:none;transition:all .24s ease;
  max-width:min(360px,88vw);text-align:center;line-height:1.4;box-shadow:0 8px 22px rgba(60,48,30,.3);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{animation:flash 1.1s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}35%{box-shadow:0 0 0 3px rgba(239,206,140,.75)}}
body.sheet-open{overflow:hidden}
.empty{font-size:12px;color:#AFA492;text-align:center;padding:14px 0}
@media (max-width:430px){
  /* iOS가 입력 때 화면을 확대하지 않도록 16px 유지 */
  .field input,.field select,.field textarea,.composer input,.custom-row input,.start-row input{font-size:16px}
}
@media (max-width:380px){
  .timer-display{font-size:52px}
  .brand h1{font-size:20px}
  .tab span{font-size:9px}
}

function mergeState(base, saved) {
  if (!saved || typeof saved !== 'object') return base;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  Object.keys(base).forEach(k => {
    const b = base[k];
    if (saved[k] === undefined) return;
    const s = saved[k];
    if (Array.isArray(b)) out[k] = Array.isArray(s) ? s : b;
    else if (b && typeof b === 'object' && s && typeof s === 'object' && !Array.isArray(s)) out[k] = mergeState(b, s);
    else out[k] = s;
  });
  return out;
}

function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
  const base = defaultState();
  state = saved ? mergeState(base, saved) : base;
  if (!saved) save();
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 */ }
  queuePush();
}

function setSyncState(text, mode, title) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  if (el.textContent !== text) el.textContent = text;
  el.setAttribute('data-mode', mode || '');
  el.title = title || text;
}

/* 원격으로 보낼 값 — 이 기기 전용 값은 뺀다 */
function syncPayloadData() {
  const out = {};
  Object.keys(state).forEach(function (k) { if (LOCAL_ONLY.indexOf(k) === -1) out[k] = state[k]; });
  return out;
}

function pushNow() {
  if (!sync.on || !sync.ref) return;
  sync.ref.set({
    data: syncPayloadData(),
    meta: { by: sync.clientId, at: Date.now(), v: 1 }
  }).then(function () {
    sync.fails = 0;
    sync.lastAt = Date.now();
    if (sync.connected) setSyncState('실시간 동기화 중', 'on', '가족 모두에게 방금 저장됐어요');
  }).catch(function () {
    sync.fails++;
    setSyncState('저장 지연 · 재시도 중', 'err', '네트워크나 보안 규칙 때문에 아직 못 보냈어요');
    if (sync.fails <= 5) setTimeout(pushNow, 4000);
  });
}

function queuePush() {
  if (!sync.on || !sync.ref) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(function () { sync.timer = null; pushNow(); }, 150);
}

function flushPush() {
  if (sync.timer) { clearTimeout(sync.timer); sync.timer = null; pushNow(); }
}

/* 다른 기기 기록을 이 기기에 반영 */
function mergeDeep(base, over) {
  if (Array.isArray(over) || over === null || typeof over !== 'object') return over;
  if (Array.isArray(base) || base === null || typeof base !== 'object') base = {};
  const keys = {};
  Object.keys(base).forEach(function (k) { keys[k] = 1; });
  Object.keys(over).forEach(function (k) { keys[k] = 1; });
  const out = {};
  Object.keys(keys).forEach(function (k) {
    const o = over[k], b = base[k];
    if (o === undefined) { out[k] = b; return; }
    if (b && typeof b === 'object' && !Array.isArray(b) && o && typeof o === 'object' && !Array.isArray(o)) out[k] = mergeDeep(b, o);
    else out[k] = o;
  });
  return out;
}

function applyRemote(data) {
  const keep = {};
  LOCAL_ONLY.forEach(function (k) { keep[k] = state[k]; });
  /* 기본값에 있는 키만이 아니라 날짜 키처럼 새로 생긴 키까지 모두 살린다 */
  const next = mergeDeep(defaultState(), data);

  /* 대화는 id 기준 합집합 — 동시에 보낸 메시지가 사라지지 않도록 */
  const chatMap = {};
  (state.chat || []).forEach(function (m) { if (m && m.id) chatMap[m.id] = m; });
  (next.chat || []).forEach(function (m) { if (m && m.id) chatMap[m.id] = m; });
  next.chat = Object.keys(chatMap).map(function (k) { return chatMap[k]; })
    .sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

  /* 한 번 찍은 도장은 유지 */
  const stamps = {};
  (next.stamps || []).concat(state.stamps || []).forEach(function (d) { stamps[d] = 1; });
  next.stamps = Object.keys(stamps).sort();

  LOCAL_ONLY.forEach(function (k) { if (keep[k] !== undefined) next[k] = keep[k]; });
  state = next;
  saveLocal();
  renderAll();
}

function onRemoteValue(snap) {
  const val = snap.val();
  if (!val || !val.data) { seedRoom(); return; }
  if (val.meta && val.meta.by === sync.clientId) { sync.lastAt = val.meta.at || sync.lastAt; return; }
  sync.applying = true;
  try { applyRemote(val.data); } catch (e) { /* 형식이 다르면 이 기기 값을 유지 */ }
  sync.applying = false;
  sync.lastAt = (val.meta && val.meta.at) || Date.now();
  if (sync.connected) setSyncState('실시간 동기화 중', 'on', '방금 다른 기기 기록을 받았어요');
}

/* DB가 비어 있을 때만 이 기기 값으로 1회 시딩 */
function seedRoom() {
  if (!sync.ref || sync.seeded) return;
  sync.seeded = true;
  sync.ref.transaction(function (cur) {
    if (cur === null) {
      return { data: syncPayloadData(), meta: { by: sync.clientId, at: Date.now(), v: 1, seed: true } };
    }
    return; /* 이미 가족 기록이 있으면 덮어쓰지 않는다 */
  }).then(function (res) {
    if (!res.committed) setSyncState('실시간 동기화 중', 'on', '가족 기록을 받아왔어요');
  }).catch(function () { sync.seeded = false; });
}

function initSync() {
  if (typeof firebase === 'undefined' || !firebase.initializeApp || !FB_CONFIG.databaseURL || FB_CONFIG.databaseURL.indexOf('__') === 0) {
    setSyncState('이 기기에만 저장', 'off', '가족 실시간 동기화가 꺼져 있어 이 기기에만 기록돼요');
    return;
  }
  setSyncState('연결 중…', 'wait', '가족 기록을 맞추는 중이에요');
  try {
    if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(FB_CONFIG);
    const db = firebase.database();
    sync.ref = db.ref(ROOM_PATH);
    sync.on = true;
    db.ref('.info/connected').on('value', function (s) {
      sync.connected = !!s.val();
      if (!sync.connected) setSyncState('오프라인 · 이 기기에만', 'err', '연결되면 자동으로 다시 맞춰요');
      else if (sync.on) setSyncState('실시간 동기화 중', 'on', '가족 모두와 같은 기록을 보고 있어요');
    });
    sync.ref.on('value', onRemoteValue, function (err) {
      setSyncState('동기화 오류', 'err', (err && err.message) || '권한 또는 네트워크 문제예요');
    });
  } catch (e) {
    sync.on = false;
    setSyncState('이 기기에만 저장', 'off', '가족 실시간 동기화를 켜지 못했어요');
  }
}

const today = () => dstr(new Date());
const memberOf = id => state.members.find(m => m.id === id) || { id: id, name: id, avatar: 'chiikawa', tagline: '' };
const isChild = id => CHILDREN.indexOf(id) !== -1;

function isDone(item, day) { return !!(item.doneOn && item.doneOn[day]); }
function setDone(item, day, on) {
  if (!item.doneOn) item.doneOn = {};
  if (on) item.doneOn[day] = 1; else delete item.doneOn[day];
}
// 복약 체크와 연결된 할 일은 건강 탭 상태를 그대로 따른다
function itemDoneToday(item) {
  if (item && item.medLink) {
    const rec = state.meds[today()] || {};
    return !!rec[item.medLink];
  }
  return isDone(item, today());
}

function starCount(id) {
  const m = memberOf(id);
  let n = m.stars || 0;
  (state.routines[id] || []).forEach(t => { n += Object.keys(t.doneOn || {}).length; });
  if (isChild(id)) (state.study[id] || []).forEach(s => { n += Object.keys(s.doneOn || {}).length; });
  return n;
}

function praiseCount(id) { return state.praises.filter(p => p.member === id).length; }

function studyTotal(child) {
  let sum = 0;
  Object.keys(state.studyLog).forEach(day => {
    (state.studyLog[day][child] || []).forEach(e => { sum += Number(e.amount) || 0; });
  });
  return sum;
}

function walletTotals(child) {
  const w = state.wallet[child] || { start: 0, goal: 0, entries: [] };
  const dep = w.entries.filter(e => e.type === 'deposit').reduce((a, e) => a + Number(e.amount || 0), 0);
  const spend = w.entries.filter(e => e.type === 'spend').reduce((a, e) => a + Number(e.amount || 0), 0);
  const study = studyTotal(child);
  return { start: Number(w.start) || 0, study: study, deposit: dep, spend: spend, total: (Number(w.start) || 0) + study + dep - spend, goal: Number(w.goal) || 0 };
}

function addStudyLog(child, day, item) {
  if (!state.studyLog[day]) state.studyLog[day] = {};
  if (!state.studyLog[day][child]) state.studyLog[day][child] = [];
  if (!state.studyLog[day][child].some(e => e.id === item.id)) {
    state.studyLog[day][child].push({ id: item.id, title: item.title, amount: Number(item.amount) || 0 });
  }
}
function removeStudyLog(child, day, id) {
  const bucket = state.studyLog[day] && state.studyLog[day][child];
  if (!bucket) return;
  state.studyLog[day][child] = bucket.filter(e => e.id !== id);
}

function isStamped(day) { return state.stamps.indexOf(day) !== -1; }
function completedTodayCount() {
  const t = today();
  let n = 0;
  Object.keys(state.routines).forEach(mid => (state.routines[mid] || []).forEach(t2 => { if (itemDoneToday(t2)) n++; }));
  return n;
}
function checkStamp(silent) {
  const t = today();
  if (!isStamped(t) && completedTodayCount() >= 3) {
    state.stamps.push(t);
    save();
    if (!silent) toast('오늘의 도장을 찍었어요! 🌟');
    return true;
  }
  return false;
}
function streak() {
  let n = 0;
  let d = new Date();
  if (!isStamped(dstr(d))) d = addDays(d, -1);
  while (isStamped(dstr(d))) { n++; d = addDays(d, -1); }
  return n;
}
function monthStampCount() {
  const now = new Date();
  const pre = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-';
  return state.stamps.filter(s => s.indexOf(pre) === 0).length;
}
function weekDates() {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // 월=0
  const mon = addDays(now, -dow);
  return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
}
function missionDoneToday() { return state.missions.completedDates.indexOf(today()) !== -1; }

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

    if (v <= 150) return { cls: 'bad', label: '나쁨' };
    return { cls: 'verybad', label: '매우 나쁨' };
  }
  if (v <= 15) return { cls: 'good', label: '좋음' };
  if (v <= 35) return { cls: 'moderate', label: '보통' };
  if (v <= 75) return { cls: 'bad', label: '나쁨' };

async function loadWeather(force) {
  const cached = state.weather;
  if (!force && cached && cached.live && (Date.now() - (cached.ts || 0) < 30 * 60 * 1000)) {
    renderWeather(); return;
  }
  const lat = 35.1105, lon = 129.0932;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 7000);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code&daily=temperature_2m_min,temperature_2m_max&timezone=Asia%2FSeoul&forecast_days=1';
    const airUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon +
      '&current=pm10,pm2_5&timezone=Asia%2FSeoul';
    const results = await Promise.all([
      fetch(url, { signal: ctrl.signal }).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(airUrl, { signal: ctrl.signal }).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    clearTimeout(timer);
    const f = results[0], a = results[1];
    if (!f || !f.current) { renderWeather(); return; }
    const code = f.current.weather_code;
    const wx = WX[code] || ['🌡️', '구름'];
    const n = new Date();
    state.weather = {
      live: true,
      ts: Date.now(),
      at: pad(n.getHours()) + ':' + pad(n.getMinutes()),
      temp: f.current.temperature_2m,
      tmin: f.daily && f.daily.temperature_2m_min ? f.daily.temperature_2m_min[0] : f.current.temperature_2m - 3,
      tmax: f.daily && f.daily.temperature_2m_max ? f.daily.temperature_2m_max[0] : f.current.temperature_2m + 3,
      emoji: wx[0],
      desc: wx[1],
      pm10: a && a.current ? a.current.pm10 : null,
      pm25: a && a.current ? a.current.pm2_5 : null
    };
    saveLocal();
    renderWeather();
  } catch (e) {
    renderWeather();
  }
}

/* ---------- 타이머 ---------- */
const timer = { running: false, remaining: 600, elapsed: 0, last: 0, handle: null };

function paintTimer() {
  const disp = $('#timerDisplay');
  if (!disp) return;
  const secs = state.timer.mode === 'down' ? Math.ceil(timer.remaining) : Math.floor(timer.elapsed);
  const mm = Math.floor(secs / 60), ss = secs % 60;
  disp.textContent = pad(mm) + ':' + pad(ss);
  const btn = $('[data-act="timer-toggle"]');
  if (btn) {
    let label = '▶ 시작';
    if (timer.running) label = '⏸ 일시정지';
    else if (state.timer.mode === 'down' && timer.remaining <= 0) label = '▶ 다시 시작';
    else if (state.timer.mode === 'down' && timer.remaining < state.timer.duration) label = '▶ 이어서';
    btn.innerHTML = label;
  }
  const hint = $('#timerHint');
  if (hint) {
    if (timer.running) hint.textContent = state.timer.mode === 'down' ? '집중하는 중 · 남은 시간이 줄어들어요' : '집중한 시간을 재는 중이에요';
    else if (state.timer.mode === 'down' && timer.remaining <= 0) hint.textContent = '공부 시간 끝! 정말 잘했어요 👏';
    else hint.textContent = Math.round(state.timer.duration / 60) + '분 · ' + (state.timer.mode === 'down' ? '시작을 눌러요' : '재는 시간 모드');
  }
}

function renderTimer() {
  const card = $('#timerCard');
  if (!card) return;
  card.innerHTML =
    '<div class="card-head"><h2>⏱️ 공부 타이머</h2><button class="btn ghost xs" data-act="toggle-sound">알림음 ' + (state.timer.sound ? '켜짐 🔔' : '꺼짐 🔕') + '</button></div>' +
    '<div class="seg" role="tablist">' +
      '<button class="seg-btn ' + (state.timer.mode === 'down' ? 'active' : '') + '" data-act="timer-mode" data-mode="down" role="tab" aria-selected="' + (state.timer.mode === 'down') + '">⏳ 남은 시간</button>' +
      '<button class="seg-btn ' + (state.timer.mode === 'up' ? 'active' : '') + '" data-act="timer-mode" data-mode="up" role="tab" aria-selected="' + (state.timer.mode === 'up') + '">⏱️ 재는 시간</button>' +
    '</div>' +
    '<p class="timer-hint" id="timerHint">10분 · 시작을 눌러요</p>' +
    '<div class="timer-display" id="timerDisplay">10:00</div>' +
    '<div class="row2"><button class="btn primary lg" data-act="timer-toggle">▶ 시작</button><button class="btn ghost" data-act="timer-reset">↺ 초기화</button></div>' +
    '<div class="chips">' + [10, 20, 30].map(m =>
      '<button class="chip-btn ' + (state.timer.duration === m * 60 ? 'active' : '') + '" data-act="timer-preset" data-min="' + m + '">' + m + '분</button>'
    ).join('') + '</div>' +
    '<div class="custom-row"><input id="customMin" type="number" min="1" max="180" inputmode="numeric" placeholder="직접 입력" aria-label="분 직접 입력"><button data-act="timer-custom">분 맞추기</button></div>';
  paintTimer();
}

function timerStart() {
  if (timer.running) return;
  if (state.timer.mode === 'down' && timer.remaining <= 0) timer.remaining = state.timer.duration;
  timer.running = true;
  timer.last = Date.now();
  const card = $('#timerCard');
  if (card) card.classList.add('running');
  clearInterval(timer.handle);
  timer.handle = setInterval(timerTick, 200);
  paintTimer();
}
function timerPause() {
  timer.running = false;
  clearInterval(timer.handle);
  timer.handle = null;
  const card = $('#timerCard');
  if (card) card.classList.remove('running');
  paintTimer();
}
function timerReset() {
  timerPause();
  timer.remaining = state.timer.duration;
  timer.elapsed = 0;
  const card = $('#timerCard');
  if (card) card.classList.remove('finished');
  paintTimer();
}
function timerTick() {
  const now = Date.now();
  const dt = (now - timer.last) / 1000;
  timer.last = now;
  if (state.timer.mode === 'down') {
    timer.remaining = Math.max(0, timer.remaining - dt);
    if (timer.remaining <= 0) {
      timerPause();
      timerFinish();
    }
  } else {
    timer.elapsed += dt;
  }
  paintTimer();
}
function timerFinish() {
  const card = $('#timerCard');
  if (card) {
    card.classList.add('finished');
    setTimeout(() => card.classList.remove('finished'), 2600);
  }
  beep();
  if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch (e) {} }
  toast('공부 시간 끝! 정말 잘했어요 👏');
  paintTimer();
}

function beep() {
  if (!state.timer.sound) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const notes = [880, 1046.5, 1318.5];
    notes.forEach((f, i) => {
      const t0 = ctx.currentTime + i * 0.19;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.32);
    });
    setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1400);
  } catch (e) { /* 소리 불가 환경 */ }
}

function fmtTime(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const ap = h < 12 ? '오전' : '오후';
  h = h % 12 || 12;
  return ap + ' ' + h + ':' + pad(d.getMinutes());
}
function chatDayLabel(ts) {
  const d = new Date(ts);
  const ds = dstr(d);
  if (ds === today()) return '오늘';
  if (ds === dstr(addDays(new Date(), -1))) return '어제';
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
}

function sheetCalendar() {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = first.getDay();
  const lastDate = new Date(y, mo + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty">.</div>';
  for (let d = 1; d <= lastDate; d++) {
    const ds = y + '-' + pad(mo + 1) + '-' + pad(d);
    const stamped = isStamped(ds);
    const isT = ds === today();
    cells += '<div class="cal-cell ' + (stamped ? 'stamp' : '') + ' ' + (isT ? 'today' : '') + '">' + (stamped ? '<span class="cal-stamp">' + AVATARS.chiikawa + '</span>' : d) + '</div>';
  }
  openSheet({
    title: (mo + 1) + '월 도장판',
    sub: '도장 ' + monthStampCount() + '개 · 🔥 ' + streak() + '일 연속',
    body:
      '<div class="cal-grid">' + WEEK.map(w => '<div class="cal-cell head">' + w + '</div>').join('') + cells + '</div>' +
      '<p class="sheet-note" style="margin-top:8px">가족이 그날 할 일 세 개 이상을 마치면 자동으로 도장이 찍혀요.</p>',
    footer: '<button class="btn ghost full" data-act="close-sheet">닫기</button>'
  });
}

function toggleRoutine(mid, id) {
  const item = (state.routines[mid] || []).find(r => r.id === id);
  if (!item) return;
  const t = today();

  // 복약 체크와 연결된 항목 → 건강 탭 상태를 함께 바꾼다
  if (item.medLink) {
    state.meds[t] = state.meds[t] || { morning: false, evening: false };
    state.meds[t][item.medLink] = !state.meds[t][item.medLink];
    save();
    renderRoutine(); renderHealth(); renderHome();
    toast(state.meds[t][item.medLink] ? '완이 ' + (item.medLink === 'morning' ? '아침' : '저녁') + ' 약 체크 완료 💊' : '약 체크를 풀었어요');
    return;
  }

  const on = !isDone(item, t);
  setDone(item, t, on);
  save();
  renderRoutine();
  renderHome();
  if (on) {
    toast(memberOf(mid).name + ' 할 일 완료! ⭐');
    if (checkStamp()) { renderStamp(); renderHome(); }
  }
}

 function toggleStudy(cid, id) {
  const item = (state.study[cid] || []).find(s => s.id === id);
  if (!item) return;
  const t = today();
  const on = !isDone(item, t);
  setDone(item, t, on);
  if (on) addStudyLog(cid, t, item); else removeStudyLog(cid, t, id);
  save();
  renderStudy();
  renderHome();
  toast(on ? memberOf(cid).name + ' 공부 완료 · ' + won(item.amount) + ' 적립 🪙' : memberOf(cid).name + ' 공부 체크를 풀었어요');
}

function completeMission() {
  if (missionDoneToday()) { toast('오늘 미션은 이미 완료했어요 🌙'); return; }
  const t = today();
  state.missions.completedDates.push(t);
  state.missions.log.push({ date: t, emoji: state.missions.current.emoji, text: state.missions.current.text });
  state.members.forEach(m => { m.stars = (m.stars || 0) + 1; });
  if (!isStamped(t)) state.stamps.push(t);
  save();
  renderHome();
  renderMission();
  renderPraise();
  toast('우리 가족 미션 완료! 모두 별 하나씩 ⭐');
}

function newMission() {
  const pool = MISSION_POOL.filter(x => x.text !== state.missions.current.text);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.missions.current = { emoji: pick.emoji, text: pick.text };
  save();
  renderHome();
  renderMission();
  toast('오늘의 미션이 바뀌었어요 ' + pick.emoji);
}

function sendPraise() {
  const chip = PRAISE_CHIPS[ui.praiseChip] || PRAISE_CHIPS[0];
  const mid = ui.praiseMember;
  const m = memberOf(mid);
  state.praises.push({ id: uid('p'), date: today(), member: mid, emoji: chip.emoji, text: chip.text });
  m.stars = (m.stars || 0) + 1;
  save();
  renderPraise();
  renderHome();
  toast(m.name + '에게 ' + chip.emoji + ' 칭찬 스티커! 별 +1 ⭐');
}

function sendChat(text, type) {
  const val = (text || '').trim();
  if (!val) { toast('메시지를 적어주세요'); return; }
  state.chat.push({ id: uid('c'), who: state.who, type: type || 'text', text: val, at: Date.now(), hearts: [], deleted: false });

  renderChat();
  $('#stickerPanel').classList.add('hidden');

document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.id === 'sheet') closeSheet();
    return;
  }
  const act = el.dataset.act;

  switch (act) {
    case 'nav': switchTab(el.dataset.tab); break;
    case 'settings': sheetSettings(); break;
    case 'share': {
      const text = '우리 가족 기록장 · ' + fmtKo(new Date()) + ' · 오늘의 미션: ' + state.missions.current.text;
      if (navigator.share) {
        navigator.share({ title: '우리 가족 기록장', text: text }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => toast('오늘 기록을 복사했어요 📋')).catch(() => toast(text));
      } else { toast(text); }
      break;
    }
    case 'todayline': sheetTodayLine(); break;
    case 'member-focus': {
      switchTab('routine');
      setTimeout(() => {
        const card = $('#routine-' + el.dataset.id);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('flash');
          setTimeout(() => card.classList.remove('flash'), 1200);
        }
      }, 80);
      break;
    }
    case 'member-wallet': {
      ui.walletChild = el.dataset.id;
      switchTab('study');
      setTimeout(() => {
        const card = $('#walletCard');
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          card.classList.add('flash');
          setTimeout(() => card.classList.remove('flash'), 1200);
        }
      }, 80);
      break;
    }
    case 'toggle-routine': toggleRoutine(el.dataset.mid, el.dataset.id); break;
    case 'add-routine': sheetRoutine(el.dataset.mid || 'jin', null); break;
    case 'edit-routine': sheetRoutine(el.dataset.mid, el.dataset.id); break;
    case 'del-routine': {
      const mid = el.dataset.mid, id = el.dataset.id;
      state.routines[mid] = (state.routines[mid] || []).filter(r => r.id !== id);
      save(); renderRoutine(); renderHome();
      toast('할 일을 지웠어요');
      break;
    }
    case 'save-routine': {
      const mid0 = el.dataset.mid, id = el.dataset.id;
      const member = $('#fMember').value;
      const text = ($('#fText').value || '').trim();
      if (!text) { toast('할 일을 적어주세요'); return; }
      if (id) {
        const from = state.routines[mid0] || [];
        const item = from.find(r => r.id === id);
        if (item) {
          item.text = text;
          if (member !== mid0) {
            state.routines[mid0] = from.filter(r => r.id !== id);
            (state.routines[member] = state.routines[member] || []).push(item);
          }
        }
      } else {
        (state.routines[member] = state.routines[member] || []).push({ id: uid('r'), text: text, doneOn: {} });
      }
      save(); closeSheet(); renderRoutine(); renderHome();
      toast('할 일을 저장했어요');
      break;
    }
    case 'toggle-study': toggleStudy(el.dataset.child, el.dataset.id); break;
    case 'add-study': sheetStudy(el.dataset.child || 'jin', null); break;
    case 'edit-study': sheetStudy(el.dataset.child, el.dataset.id); break;
    case 'del-study': {
      const cid = el.dataset.child, id = el.dataset.id;
      state.study[cid] = (state.study[cid] || []).filter(s => s.id !== id);
      Object.keys(state.studyLog).forEach(day => {
        if (state.studyLog[day][cid]) state.studyLog[day][cid] = state.studyLog[day][cid].filter(e => e.id !== id);
      });
      save(); renderStudy(); renderHome();
      toast('공부 항목을 지웠어요');
      break;
    }
    case 'pin-study': {
      const cid = el.dataset.child, id = el.dataset.id;
      const item = (state.study[cid] || []).find(s => s.id === id);
      if (item) { item.pinned = !item.pinned; save(); renderStudy(); }
      break;
    }
    case 'save-study': {
      const cid0 = el.dataset.child, id = el.dataset.id;
      const child = $('#fChild').value;
      const title = ($('#fTitle').value || '').trim();
      const detail = ($('#fDetail').value || '').trim();
      const amount = Math.max(0, Math.floor(Number($('#fAmount').value) || 0));
      const pinned = $('#fPin').checked;
      if (!title) { toast('공부 이름을 적어주세요'); return; }
      if (id) {
        const item = (state.study[cid0] || []).find(s => s.id === id);
        if (item) {
          item.title = title; item.detail = detail; item.amount = amount; item.pinned = pinned;
          if (child !== cid0) {
            state.study[cid0] = state.study[cid0].filter(s => s.id !== id);
            (state.study[child] = state.study[child] || []).push(item);
          }
        }
      } else {
        (state.study[child] = state.study[child] || []).push({ id: uid('s'), title: title, detail: detail, amount: amount, pinned: pinned, doneOn: {} });
      }
      save(); closeSheet(); renderStudy(); renderHome();
      toast('공부 항목을 저장했어요');
      break;
    }
    case 'load-presets': {
      let added = 0;
      CHILDREN.forEach(cid => {
        state.study[cid] = state.study[cid] || [];
        STUDY_PRESET[cid].forEach(p => {
          if (!state.study[cid].some(s => s.title === p.title)) {
            state.study[cid].push({ id: uid('s'), title: p.title, detail: p.detail, amount: p.amount, pinned: true, doneOn: {} });
            added++;
          }
        });
      });
      save(); renderStudy();
      toast(added ? '고정 항목 ' + added + '개를 넣었어요' : '이미 다 들어 있어요');
      break;
    }
    case 'timer-mode': {
      state.timer.mode = el.dataset.mode;
      save();
      timerReset();
      renderTimer();
      break;
    }
    case 'timer-toggle': {
      if (timer.running) timerPause(); else timerStart();
      break;
    }
    case 'timer-reset': timerReset(); break;
    case 'timer-preset': {
      const mins = Number(el.dataset.min) || 10;
      state.timer.duration = mins * 60;
      save();
      timerReset();
      renderTimer();
      break;
    }
    case 'timer-custom': {
      const v = Math.floor(Number($('#customMin').value) || 0);
      if (v < 1 || v > 180) { toast('1~180분 사이로 입력해 주세요'); return; }
      state.timer.duration = v * 60;
      save();
      timerReset();
      renderTimer();
      toast(v + '분으로 맞췄어요');
      break;
    }
    case 'toggle-sound': {
      state.timer.sound = !state.timer.sound;
      save(); renderTimer();
      toast(state.timer.sound ? '알림음을 켰어요 🔔' : '알림음을 껐어요 🔕');
      break;
    }
    case 'wallet-child': { ui.walletChild = el.dataset.child; renderWallet(); break; }
    case 'add-money': sheetMoney(el.dataset.child, el.dataset.type); break;
    case 'save-money': {
      const cid = el.dataset.child, type = el.dataset.type;
      const amount = Math.floor(Number($('#fMoney').value) || 0);
      if (amount <= 0) { toast('금액을 적어주세요'); return; }
      state.wallet[cid].entries.push({ id: uid('w'), date: today(), type: type, amount: amount, memo: ($('#fMemo').value || '').trim() });
      save(); closeSheet(); renderWallet(); renderHome();
      toast(type === 'deposit' ? won(amount) + ' 입금했어요' : won(amount) + ' 사용했어요');
      break;
    }
    case 'del-entry': {
      const cid = el.dataset.child, id = el.dataset.id;
      state.wallet[cid].entries = state.wallet[cid].entries.filter(x => x.id !== id);
      save(); renderWallet(); renderHome();
      toast('기록을 지웠어요');
      break;
    }
    case 'med': {
      const t = today();
      state.meds[t] = state.meds[t] || { morning: false, evening: false };
      state.meds[t][el.dataset.slot] = !state.meds[t][el.dataset.slot];
      save(); renderHealth();
      toast(state.meds[t][el.dataset.slot] ? '완이 약 체크 완료 💊' : '체크를 풀었어요');
      break;
    }
    case 'add-note': sheetNote(); break;
    case 'save-note': {
      const text = ($('#fNote').value || '').trim();
      if (!text) { toast('메모를 적어주세요'); return; }
      state.healthNotes.push({ id: uid('h'), date: $('#fDate').value || today(), member: $('#fMember').value, kind: $('#fKind').value, text: text });
      save(); closeSheet(); renderHealth();
      toast('건강 메모를 저장했어요');
      break;
    }
    case 'del-note': {
      state.healthNotes = state.healthNotes.filter(n => n.id !== el.dataset.id);
      save(); renderHealth();
      toast('메모를 지웠어요');
      break;
    }
    case 'mission-done': completeMission(); break;
    case 'mission-new': newMission(); break;
    case 'praise-member': ui.praiseMember = el.dataset.id; renderPraise(); break;
    case 'praise-chip': ui.praiseChip = Number(el.dataset.i); renderPraise(); break;
    case 'praise-send': sendPraise(); break;
    case 'del-praise': {
      state.praises = state.praises.filter(p => p.id !== el.dataset.id);
      save(); renderPraise(); renderHome();
      toast('칭찬 기록을 지웠어요');
      break;
    }
    case 'who': {
      state.who = el.dataset.id;
      save(); renderChat();
      toast(memberOf(state.who).name + '(으)로 이 기기를 정했어요');
      break;
    }
    case 'chat-send': sendChat($('#chatInput').value, 'text'); break;
    case 'chat-sticker': sendChat(el.dataset.s, 'sticker'); break;
    case 'sticker-toggle': $('#stickerPanel').classList.toggle('hidden'); break;
    case 'chat-heart': {
      const msg = state.chat.find(c => c.id === el.dataset.id);
      if (!msg) break;
      msg.hearts = msg.hearts || [];
      const i = msg.hearts.indexOf(state.who);
      if (i === -1) msg.hearts.push(state.who); else msg.hearts.splice(i, 1);
      save(); renderChat();
      break;
    }
    case 'chat-del': {
      state.chat = state.chat.filter(c => c.id !== el.dataset.id);
      save(); renderChat();
      toast('메시지를 지웠어요');
      break;
    }
    case 'stamp-calendar': sheetCalendar(); break;
    case 'close-sheet': closeSheet(); break;
    case 'save-line': {
      state.todayLine = ($('#fLine').value || '').trim();
      save(); closeSheet(); renderHeader();
      toast(state.todayLine ? '오늘의 한 줄을 남겼어요 ✨' : '한 줄을 지웠어요');
      break;
    }
    case 'save-settings': {
      state.members.forEach(m => {
        const input = $('#sName-' + m.id);
        if (input) m.name = (input.value || '').trim() || m.name;
      });
      const motto = ($('#sMotto').value || '').trim();
      state.motto = motto || state.motto;
      state.defaults.studyAmount = state.defaults.studyAmount || {};
      CHILDREN.forEach(c => {
        const amt = $('#sAmt-' + c), goal = $('#sGoal-' + c);
        if (amt) state.defaults.studyAmount[c] = Math.max(0, Math.floor(Number(amt.value) || 0));
        if (goal) state.wallet[c].goal = Math.max(0, Math.floor(Number(goal.value) || 0));
      });
      save(); closeSheet(); renderAll();
      toast('설정을 저장했어요');
      break;
    }
    case 'reset-data': {
      sheetConfirm('예시 데이터로 초기화할까요?', '엄마·아빠·아이들 모든 기기에서 체크한 내용과 대화가 함께 지워져요. 되돌릴 수 없어요.', 'reset-yes', '초기화');
      break;
    }
    case 'reset-yes': {
      state = defaultState();
      save();
      closeSheet();
      renderAll();
      timerReset();
      toast('처음 예시 데이터로 돌아왔어요');
      break;
    }
    default: break;
  }
});

document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'sheet') closeSheet();
});

document.addEventListener('change', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'wallet-start') {
    setWalletStart(el.dataset.child, el.value);
    toast('시작 금액을 ' + won(state.wallet[el.dataset.child].start) + '(으)로 바꿨어요');
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
  if (e.target && e.target.id === 'chatInput' && e.key === 'Enter') {
    e.preventDefault();
    sendChat(e.target.value, 'text');
  }
});

/* =========================================================
   17. 시작
   ========================================================= */
function renderAll() {
  renderHeader();
  renderHome();
  renderRoutine();
  renderStudy();
  renderHealth();
  renderPraise();
  renderChat();
  paintTimer();
}

function boot() {
  loadState();
  renderTabbar();
  renderAll();
  switchTab('home');
  loadWeather(false);
  initSync();

  // 자정이 지나면 날짜 관련 표시를 새로 고침
  let lastDay = today();
  setInterval(function () {
    const now = today();
    if (now !== lastDay) {
      lastDay = now;
      renderAll();
      switchTab('home');
    }
    paintTimer();
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && today() !== lastDay) { lastDay = today(); renderAll(); }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

// 검증용
window.__familyDashboard = {
  get state() { return state; },
  version: '1.0'
};
})();
</script>
</body>
</html>
